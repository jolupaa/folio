# iOS: sin esto rustc enlaza para iOS 10.0 y falla con `___chkstk_darwin` (existe desde iOS 13),
# que usa el código C++ de llama.cpp. Debe coincidir con el objetivo del Podfile (16.0).
[env]
# force: Xcode exporta su propio valor (el del pod) y sin esto tendría prioridad.
IPHONEOS_DEPLOYMENT_TARGET = { value = "16.0", force = true }
