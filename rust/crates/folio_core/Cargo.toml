[package]
name = "folio_core"
version = "0.1.0"
edition = "2021"
description = "Folio: dominio, persistencia SQLite, búsqueda y adjuntos"

[dependencies]
anyhow = "1"
thiserror = "2"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
log = "0.4"
# Imágenes: decodificación (JPEG/PNG/WebP/GIF), orientación EXIF, recorte y codificación JPEG.
# Sin features por defecto (sin rayon ni códecs nativos): puro Rust, compila en Android/iOS.
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
sha2 = "0.10"
hex = "0.4"
# Capa de texto de PDF (reexporta lopdf 0.42, usado también para generar PDFs en los tests).
pdf-extract = "0.12.1"
unicode-normalization = "0.1.24"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
