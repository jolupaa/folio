[package]
name = "folio_ai"
version = "0.1.0"
edition = "2021"
description = "Folio: índice RAG, gestor de modelos, inferencia local (llama.cpp) y estudio"

[features]
default = ["llama"]
# Motor real llama.cpp; sin esta feature solo existe el motor simulado (tests rápidos).
llama = ["dep:llama-cpp-2"]

[dependencies]
folio_core = { path = "../folio_core" }
anyhow = "1"
thiserror = "2"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
log = "0.4"
# Descargas HTTPS con rustls (sin OpenSSL) y raíces de Mozilla incluidas (sin verificador del sistema).
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
# Sin features por defecto: sin OpenMP (ggml usa su propio pool de hilos), sin `common`
# (evita compilar cpp-httplib/OpenSSL) y sin libc++_shared en Android (ver tablas por target).
llama-cpp-2 = { version = "=0.1.161", default-features = false, optional = true }

# Android: libc++ estática dentro de libfolio_bridge.so (no hace falta empaquetar libc++_shared.so).
[target.'cfg(target_os = "android")'.dependencies]
llama-cpp-2 = { version = "=0.1.161", default-features = false, optional = true, features = ["android-static-stdcxx"] }

# iOS: backend Metal (GPU) de llama.cpp.
[target.'cfg(target_os = "ios")'.dependencies]
llama-cpp-2 = { version = "=0.1.161", default-features = false, optional = true, features = ["metal"] }

[dev-dependencies]
anyhow = "1"
tempfile = "3"
tiny_http = "0.12"

[[example]]
name = "e2e"
required-features = ["llama"]
