name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Rust targets
        run: rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: flutter --version && xcodebuild -version
      - run: flutter pub get
      - name: Build (sin firma)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign -v 2>&1 | grep -v "ld: warning" > build.log || { 
            grep -n -B2 -A30 "Undefined symbols\|ld: \|error:\|SEVERE" build.log | tail -300; exit 1; }
          tail -5 build.log
